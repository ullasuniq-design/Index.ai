<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Morarji Cricket League</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#081b33;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#022244;
    text-align:center;
    padding:16px;
    font-size:24px;
    font-weight:bold;
    border-bottom:3px solid #ffcc00;
}

.searchBox{
    padding:15px;
    text-align:center;
}

.searchBox input{
    width:180px;
    padding:12px;
    border:none;
    border-radius:8px;
}

.searchBox button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    background:#ffcc00;
    color:black;
    font-weight:bold;
    margin-left:5px;
}

.profileCard{
    background:#0f2e54;
    margin:10px;
    border-radius:15px;
    padding:15px;
    text-align:center;
}

#photoArea{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    background:#d9d9d9;
    color:#444;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-size:18px;
}

#photoArea img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#playerName{
    margin-top:15px;
    font-size:28px;
    font-weight:bold;
}

#playerHand{
    color:#ffcc00;
    margin-top:5px;
}

#teams{
    margin-top:10px;
    font-size:13px;
    color:#ddd;
}

.sectionTitle{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-top:20px;
    margin-bottom:10px;
}

.summaryGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.statCard{
    background:#1697c5;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.statName{
    font-size:13px;
}

.statValue{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

#formatCards{
    padding:10px;
}

.formatCard{
    background:#0f2e54;
    margin-bottom:12px;
    border-radius:15px;
    overflow:hidden;
}

.formatHeader{
    background:#ffcc00;
    color:black;
    font-weight:bold;
    padding:12px;
    text-align:center;
}

.formatBody{
    padding:10px;
}

.formatRow{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.formatRow:last-child{
    border-bottom:none;
}

.label{
    color:#cccccc;
}

.value{
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
🏏 MORARJI CRICKET LEAGUE
</div>

<div class="searchBox">

<input
id="cap"
placeholder="Player CAP Number">

<button onclick="searchPlayer()">
Search
</button>

</div>

<div class="profileCard">

<div id="photoArea">
No Photo
</div>

<div id="playerName">
Enter CAP Number
</div>

<div id="playerHand">
-
</div>

<div id="teams">
Search player to view profile
</div>

</div>

<div class="sectionTitle">
Career Summary
</div>

<div class="summaryGrid">

<div class="statCard">
<div class="statName">Matches</div>
<div id="cMatches" class="statValue">-</div>
</div>

<div class="statCard">
<div class="statName">Runs</div>
<div id="cRuns" class="statValue">-</div>
</div>

<div class="statCard">
<div class="statName">Average</div>
<div id="cAvg" class="statValue">-</div>
</div>

<div class="statCard">
<div class="statName">Strike Rate</div>
<div id="cSR" class="statValue">-</div>
</div>

<div class="statCard">
<div class="statName">4's</div>
<div id="c4s" class="statValue">-</div>
</div>

<div class="statCard">
<div class="statName">6's</div>
<div id="c6s" class="statValue">-</div>
</div>

</div>

<div class="sectionTitle">
Format Performance
</div>

<div id="formatCards">

</div>

script.js

</body>
</html>
