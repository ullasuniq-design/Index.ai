<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCL Player Statistics</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:15px;
}

.header{
    background:#003366;
    color:white;
    text-align:center;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.search-box{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.error{
    color:red;
    margin-top:10px;
    font-weight:bold;
    text-align:center;
}

.card{
    display:none;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.photo{
    text-align:center;
}

.photo img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:4px solid #003366;
    object-fit:cover;
}

.name{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

.details{
    margin-top:15px;
    line-height:1.8;
}

.stats-title{
    margin-top:20px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#003366;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

td:first-child{
    text-align:left;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
    <h2>MCL PLAYER STATISTICS</h2>
</div>

<div class="search-box">

<input
id="cap"
type="number"
placeholder="Enter CAP Number (Example: 1, 2, 23)"
>

<button onclick="searchPlayer()">
Search
</button>

<div id="error" class="error"></div>

</div>

<div id="playerCard" class="card">

<div class="photo">

</div>

<div id="playerName" class="name"></div>

<div class="details">
<p><b>CAP #:</b> <span id="capNo"></span></p>
<p><b>Batch:</b> <span id="batch"></span></p>
<p><b>Played Seasons:</b> <span id="season"></span></p>
</div>

<div class="stats-title">
Player Statistics
</div>

<table>

<thead>
<tr>
<th>Statistic</th>
<th>Turf</th>
<th>Long</th>
<th>Short Pitch</th>
</tr>
</thead>

<tbody id="statsBody">

</tbody>

</table>

</div>
