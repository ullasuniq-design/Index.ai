<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morarji Cricket League</title><link rel="stylesheet" href="style.css"></head><body><div class="header">MORARJI CRICKET LEAGUE</div><div class="search"><label>Player CAP Number</label><div class="row"><input id="cap" placeholder="Enter CAP Number"><button onclick="searchPlayer()">Search</button></div></div><div class="photoWrap"><img id="photo" src="photos/default.jpg" alt="Player Photo"></div><div class="player"><h2 id="name">Search a Player</h2><p id="team"></p></div><div class="grid"><div class="card"><span>Matches</span><b id="mat">-</b></div><div class="card"><span>Innings</span><b id="inns">-</b></div><div class="card"><span>Runs</span><b id="runs">-</b></div><div class="card"><span>Average</span><b id="avg">-</b></div><div class="card"><span>Strike Rate</span><b id="sr">-</b></div><div class="card"><span>Highest</span><b id="highest">-</b></div><div class="card"><span>Balls</span><b id="balls">-</b></div><div class="card"><span>Not Out</span><b id="no">-</b></div><div class="card"><span>4's</span><b id="fours">-</b></div></div><script src="script.js"></script></body></html>
